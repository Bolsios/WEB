<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Código de Barras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white flex items-center justify-center gap-2">
                <i class="fas fa-barcode"></i>
                Escáner de Código de Barras
            </h1>
            <p class="text-indigo-200 mt-2">Escanea códigos de barras y agrega comentarios</p>
        </div>

        <!-- Main Content -->
        <div class="p-6 space-y-6">
            <!-- Scanner Button -->
            <div class="text-center">
                <button id="scanButton" class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transform transition duration-200 hover:scale-105 flex items-center gap-3 mx-auto">
                    <i class="fas fa-camera"></i>
                    <span>Escanea Código de Barras</span>
                </button>
                <p class="text-gray-500 text-sm mt-2">Presiona para abrir la cámara</p>
            </div>

            <!-- Text Input 1 -->
            <div class="space-y-2">
                <label class="block text-gray-700 font-medium">
                    <i class="fas fa-barcode text-indigo-600 mr-2"></i>
                    Código Escaneado
                </label>
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="scannerInput" 
                        placeholder="El código se mostrará aquí después de escanear"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                        readonly
                    >
                    <button id="manualEntryButton" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg transition flex items-center justify-center">
                        <i class="fas fa-edit"></i>
                    </button>
                </div>
            </div>

            <!-- Manual Entry Modal -->
            <div id="manualEntryModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden p-4">
                <div class="bg-white rounded-lg w-full max-w-md p-6 relative">
                    <button id="closeManualEntry" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                    <h3 class="text-xl font-bold text-center mb-4">Ingreso Manual</h3>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-2">Ingresa el código manualmente:</label>
                        <input 
                            type="text" 
                            id="manualCodeInput" 
                            placeholder="Ej: 1234567890"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                        >
                    </div>
                    <button id="saveManualCode" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg transition">
                        <i class="fas fa-save mr-2"></i>Guardar Código
                    </button>
                </div>
            </div>

            <!-- Text Input 2 -->
            <div class="space-y-2">
                <label class="block text-gray-700 font-medium">
                    <i class="fas fa-comment-dots text-indigo-600 mr-2"></i>
                    Comentarios
                </label>
                <textarea 
                    id="commentInput" 
                    placeholder="Agrega comentarios sobre el código escaneado"
                    rows="3"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                ></textarea>
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
                <button id="submitButton" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-4 px-4 rounded-lg shadow-lg transform transition duration-200 hover:scale-[1.02] flex items-center justify-center gap-2">
                    <i class="fas fa-paper-plane"></i>
                    <span>Enviar Información</span>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-gray-50 p-4 text-center text-gray-500 text-sm border-t">
            <p>Datos enviados a Google Forms</p>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div id="scannerModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-lg w-full max-w-md p-6 relative">
            <button id="closeScanner" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-center mb-4">Cámara de Escaneo</h3>
            <div class="relative h-64 bg-gray-200 rounded-lg overflow-hidden mb-4">
                <video id="cameraVideo" class="w-full h-full object-cover"></video>
                <div class="absolute inset-0 border-4 border-dashed border-green-500 rounded-lg m-2 opacity-70"></div>
            </div>
            <button id="captureButton" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition">
                <i class="fas fa-camera mr-2"></i>Capturar Código
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const scanButton = document.getElementById('scanButton');
        const scannerModal = document.getElementById('scannerModal');
        const closeScanner = document.getElementById('closeScanner');
        const cameraVideo = document.getElementById('cameraVideo');
        const captureButton = document.getElementById('captureButton');
        const scannerInput = document.getElementById('scannerInput');
        const commentInput = document.getElementById('commentInput');
        const submitButton = document.getElementById('submitButton');
        const manualEntryButton = document.getElementById('manualEntryButton');
        const manualEntryModal = document.getElementById('manualEntryModal');
        const closeManualEntry = document.getElementById('closeManualEntry');
        const manualCodeInput = document.getElementById('manualCodeInput');
        const saveManualCode = document.getElementById('saveManualCode');

        // Variables
        let stream = null;

        // Open camera modal
        scanButton.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                cameraVideo.srcObject = stream;
                scannerModal.classList.remove('hidden');
            } catch (err) {
                alert('No se pudo acceder a la cámara. Por favor verifica los permisos.');
                console.error('Error accessing camera:', err);
            }
        });

        // Close scanner modal
        closeScanner.addEventListener('click', () => {
            scannerModal.classList.add('hidden');
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });

        // Capture barcode (simulated for demo)
        captureButton.addEventListener('click', () => {
            // Simulate barcode scanning result
            const randomCode = `CODE-${Math.floor(Math.random() * 1000000)}`;
            scannerInput.value = randomCode;
            scannerModal.classList.add('hidden');
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });

        // Open manual entry modal
        manualEntryButton.addEventListener('click', () => {
            manualEntryModal.classList.remove('hidden');
        });

        // Close manual entry modal
        closeManualEntry.addEventListener('click', () => {
            manualEntryModal.classList.add('hidden');
        });

        // Save manual code
        saveManualCode.addEventListener('click', () => {
            const code = manualCodeInput.value.trim();
            if (code) {
                scannerInput.value = code;
                manualEntryModal.classList.add('hidden');
                manualCodeInput.value = '';
            } else {
                alert('Por favor ingresa un código válido');
            }
        });

        // Submit form
        submitButton.addEventListener('click', () => {
            const barcode = scannerInput.value.trim();
            const comment = commentInput.value.trim();

            if (!barcode) {
                alert('Por favor escanea un código de barras o ingrésalo manualmente');
                return;
            }

            // Construct Google Form URL
            const formUrl = `https://docs.google.com/forms/d/e/1FAIpQLScTrvEmNX4YMqAnzAkUmHkmDmNAUImx2IS_OTQ0huHOdpXIXw/formResponse?entry.1707704143=${encodeURIComponent(barcode)}&entry.564631408=${encodeURIComponent(comment)}`;

            // Open form in new tab
            window.open(formUrl, '_blank');

            // Clear inputs and show success message
            scannerInput.value = '';
            commentInput.value = '';
            
            // Optional: Show success message
            alert('¡Datos enviados exitosamente! Los campos han sido limpiados.');
        });

        // Add focus effect to inputs
        const inputs = [scannerInput, commentInput];
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.classList.add('ring-2', 'ring-indigo-500');
            });
            
            input.addEventListener('blur', () => {
                input.classList.remove('ring-2', 'ring-indigo-500');
            });
        });
    </script>
</body>
</html>
