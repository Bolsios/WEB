<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZKTeco Precision Decoder v2</title>
    <style>
        :root {
            --bg: #08111b;
            --card: #101c2b;
            --accent: #00e5c3;
            --accent2: #00a8ff;
            --text: #dcefff;
            --muted: #6d8aa0;
            --border: rgba(0, 229, 195, .2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .dropzone { border: 2px dashed var(--accent); padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .dropzone:hover { background: rgba(0, 229, 195, 0.05); }
        .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #00131d; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 5px; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn.secondary { background: #17283b; color: var(--text); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(0,0,0,0.2); }
        th { background: #162636; color: var(--accent); text-align: left; padding: 12px; border-bottom: 2px solid var(--border); }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-family: 'Consolas', monospace; }
        .log { background: #040a0f; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto; color: #00d68f; border: 1px solid #1a2a3a; }
        .no-pass { color: #ff5f6d; font-style: italic; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>ZKTeco Binary Parser (Soporte Sin Contraseña)</h2>
        <p style="color: var(--muted); margin-bottom: 15px;">Detección inteligente de IDs, Nombres y Contraseñas opcionales.</p>
        <div class="dropzone" id="dropzone">
            <h3>Arrastra tu archivo .u aquí</h3>
            <input type="file" id="fileInput" hidden>
        </div>
    </div>

    <div class="card">
        <h4>Consola de Eventos</h4>
        <div class="log" id="log"></div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>Registros Extraídos</h3>
            <div>
                <button class="btn secondary" id="csvBtn" disabled>Exportar CSV</button>
                <button class="btn" id="xlsBtn" disabled>Exportar Excel</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Referencia (Nombre)</th>
                    <th>Contraseña</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>
</div>

<script>
    const App = { records: [] };
    const logEl = document.getElementById('log');
    const dataTable = document.getElementById('dataTable');

    function log(msg) {
        const d = document.createElement('div');
        d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('dropzone').onclick = () => document.getElementById('fileInput').click();

    document.getElementById('fileInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        log(`Analizando binario: ${file.name}`);
        const buffer = await file.arrayBuffer();
        const data = new Uint8Array(buffer);
        
        // Decodificamos permitiendo ver los caracteres nulos como espacios
        const text = new TextDecoder('ascii').decode(data);
        const cleanedText = text.replace(/[^\x20-\x7E]/g, ' ').replace(/\s+/g, ' '); 
        
        /* REGEX MEJORADO: 
           Busca un número (ID), 
           seguido OPCIONALMENTE de otro número (Password), 
           seguido de una palabra (Nombre).
        */
        const regex = /(\d+)\s+(\d+)?\s*([A-Za-záéíóúÁÉÍÓÚñÑ]+)/g;
        let match;
        const records = [];

        while ((match = regex.exec(cleanedText)) !== null) {
            let id, password, reference;

            // Si el segundo grupo capturado existe, es la contraseña. 
            // Si no, el primer grupo es el ID y el tercero el nombre.
            if (match[2]) {
                id = match[1];
                password = match[2];
                reference = match[3];
            } else {
                id = match[1];
                password = ""; // No posee contraseña
                reference = match[3];
            }

            records.push({ id, reference, password });
        }

        App.records = records;
        renderTable(records);
        
        if (records.length > 0) {
            document.getElementById('csvBtn').disabled = false;
            document.getElementById('xlsBtn').disabled = false;
            log(`Éxito: Se procesaron ${records.length} usuarios.`);
        } else {
            log("Error: No se detectó el patrón de datos.");
        }
    };

    function renderTable(data) {
        dataTable.innerHTML = data.map(r => `
            <tr>
                <td>${r.id}</td>
                <td>${r.reference}</td>
                <td>${r.password ? r.password : '<span class="no-pass">(Sin contraseña)</span>'}</td>
            </tr>
        `).join('');
    }

    document.getElementById('csvBtn').onclick = () => {
        const csv = "ID,Referencia,Contraseña\n" + 
            App.records.map(r => `${r.id},${r.reference},${r.password}`).join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8' });
        saveFile(blob, "usuarios_zkteco.csv");
    };

    document.getElementById('xlsBtn').onclick = () => {
        let xml = `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Worksheet ss:Name="ZKTeco">
<Table>
<Row><Cell><Data ss:Type="String">ID</Data></Cell><Cell><Data ss:Type="String">Referencia</Data></Cell><Cell><Data ss:Type="String">Contraseña</Data></Cell></Row>`;

        App.records.forEach(r => {
            xml += `<Row>
<Cell><Data ss:Type="Number">${r.id}</Data></Cell>
<Cell><Data ss:Type="String">${r.reference}</Data></Cell>
<Cell><Data ss:Type="String">${r.password}</Data></Cell>
</Row>`;
        });

        xml += `</Table></Worksheet></Workbook>`;
        const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
        saveFile(blob, "usuarios_zkteco.xls");
    };

    function saveFile(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 100);
    }
</script>
</body>
</html>
